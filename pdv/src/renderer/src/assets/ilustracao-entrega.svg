  <path d="M150 108l26 4 10 24" fill="none" stroke="#9e0b22" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="170" cy="40" r="20" fill="#c8102e"/>
  <path d="M154 40h30c0 8-7 14-15 14s-15-6-15-14z" fill="#111111" opacity="0.85"/>
  <path d="M152 34c4-10 12-14 20-14" stroke="#fbf3e8" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- linhas de velocidade -->
  <path d="M8 118h30M18 134h24M4 150h22" stroke="#d9541e" stroke-width="5" stroke-linecap="round"/>
