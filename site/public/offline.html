<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9E0B22" />
    <title>Cabana Boemia · Sem conexão</title>
    <link rel="icon" href="/icones/icone-192.png" />
    <!-- Mostrada pelo service worker (sw.js) quando a página não carrega sem
         internet. Sem script: a CSP do site não libera script inline, e o
         "Tentar de novo" é um link comum. Estilo inline é liberado pela CSP. -->
    <style>
      html, body { margin: 0; min-height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; min-height: 100dvh; padding: 24px 16px; box-sizing: border-box;
        background: #fbf3e8; color: #111111; text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      main { max-width: 360px; }
      img { width: 120px; height: 120px; border-radius: 24px; border: 2px solid #c9a646; }
      h1 { margin: 20px 0 8px; font-size: 1.25rem; color: #9e0b22; }
      p { margin: 0 0 24px; line-height: 1.45; color: #5e5249; }
      a {
        display: inline-block; padding: 12px 28px; border-radius: 999px;
        background: #c8102e; color: #ffffff; font-weight: 700; text-decoration: none;
      }
      a:active { background: #9e0b22; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icones/icone-512.png" alt="Cabana Boemia" />
      <h1>Sem conexão.</h1>
      <p>Verifique sua internet para fazer o pedido.</p>
      <a href="/">Tentar de novo</a>
    </main>
  </body>
</html>
