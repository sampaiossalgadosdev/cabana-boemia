  <path d="M74 98h14" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <!-- piloto -->
  <path d="M138 104l10-40c2-8 10-12 18-10l14 4c8 2 12 10 10 18l-8 28z" fill="#111111"/>
