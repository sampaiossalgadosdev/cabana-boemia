<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Splash de abertura (public/splash/): decide antes do primeiro paint se aparece.
         Fica de fora nas páginas legais e por 3 h depois de vista ('cbSplash').
         O hash deste script está na CSP do site (CSP_SITE em api/src/lib/estaticos.js):
         mudou uma vírgula, o teste do estaticos acusa. -->
    <script>try{var d=document.documentElement;if(/^\/(privacidade|termos)\/?$/.test(location.pathname))d.classList.add('cb-sem-splash');else{var t=+localStorage.getItem('cbSplash');if(t&&Date.now()-t<3*3600e3)d.classList.add('cb-sem-splash')}}catch(e){}</script>
    <link rel="stylesheet" href="/splash/splash.css" />
    <link rel="preload" as="image" href="/splash/logo-corpo.webp" />
    <!-- Animação de pedido confirmado (public/confirmacao/; src/lib/confirmacao.js) -->
    <link rel="stylesheet" href="/confirmacao/confirmacao.css" />
    <script src="/confirmacao/confirmacao.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9E0B22" />
    <meta name="description" content="Cardápio e pedidos da Cabana Boemia, Abatiá-PR." />
    <title>Cabana Boemia · Cardápio</title>
  </head>
  <body>
    <div id="cb-splash" aria-hidden="true">
      <div class="cb-onda"></div>
      <div class="cb-palco">
        <div class="cb-logo">
          <img class="cb-corpo" src="/splash/logo-corpo.webp" alt="" />
          <div class="cb-brilho"></div>
          <img class="cb-coroa" src="/splash/logo-coroa.webp" alt="" />
          <span class="cb-faisca f1"></span>
          <span class="cb-faisca f2"></span>
          <span class="cb-faisca f3"></span>
        </div>
      </div>
    </div>
    <script src="/splash/splash.js"></script>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
