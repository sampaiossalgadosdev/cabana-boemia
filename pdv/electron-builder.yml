# Instalador Windows do PDV (npm run dist -w pdv → pdv/dist).
appId: br.com.cabanaboemia.pdv
productName: Cabana Boemia PDV
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target: nsis
  # Ícone: pendente a versão quadrada da logo (shared/assets). Até lá, ícone padrão do Electron.
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Cabana Boemia PDV
