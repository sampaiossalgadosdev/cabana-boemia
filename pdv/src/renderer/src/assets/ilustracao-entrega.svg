  <path d="M20 182h280" stroke="#c9a646" stroke-width="3" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- rodas -->
  <circle cx="88" cy="150" r="28" fill="#111111"/>
  <circle cx="88" cy="150" r="12" fill="#fbf3e8"/>
  <circle cx="236" cy="150" r="28" fill="#111111"/>
  <circle cx="236" cy="150" r="12" fill="#fbf3e8"/>
  <!-- moto -->
  <path d="M70 140c8-26 34-34 58-34h44l20 24h30c10 0 18 8 18 18v4H70z" fill="#c8102e"/>
  <path d="M192 130l22-44h14" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
  <rect x="218" y="78" width="22" height="9" rx="4" fill="#111111"/>
  <path d="M120 106h52l-6 16h-40z" fill="#9e0b22"/>
  <!-- baú de entrega -->
  <rect x="52" y="70" width="58" height="46" rx="6" fill="#c9a646"/>
