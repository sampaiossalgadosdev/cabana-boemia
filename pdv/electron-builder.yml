# Instalador Windows do PDV (um só para todas as lojas): npm run dist -w pdv → pdv/dist/PDV-do-Batia-Setup-<versão>.exe
# Antes era "Cabana Boemia PDV" (br.com.cabanaboemia.pdv): o app novo importa a configuração
# dele no primeiro uso (src/main/migracao.js) e desliga o "abrir com o Windows" antigo.
appId: br.com.deliveryabatia.pdv
productName: PDV do Batiá
# Nome do arquivo sem acento nem espaço (mais fácil de mandar por WhatsApp/pen drive).
artifactName: PDV-do-Batia-Setup-${version}.${ext}
directories:
  output: dist
  # recursos/icon.png é gerado por scripts/gerar-icone.mjs antes do build (ícone da plataforma, não de uma loja).
  buildResources: recursos
files:
  - out/**
  - package.json
asar: true
# koffi: o binário nativo (@koromix/koffi-win32-x64) sai fora do asar (o electron-builder
# detecta o .node; deixado explícito para não depender da detecção).
asarUnpack:
  - node_modules/@koromix/**
win:
  target:
    - target: nsis
      arch: x64
  icon: recursos/icon.png
nsis:
  # Instalação de um clique, só para o usuário do Windows (sem pedir administrador).
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: PDV do Batiá
  # Abre ao terminar: na primeira abertura o app se registra para abrir com o Windows.
  runAfterFinish: true
  uninstallDisplayName: PDV do Batiá
  # Instalar tira o "abrir com o Windows" do programa antigo; desinstalar tira o deste (recursos/installer.nsh).
  include: recursos/installer.nsh
