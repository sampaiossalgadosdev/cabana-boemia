<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Entregador de moto">
  <!-- Ilustração provisória (cores da Cabana Boemia). Para trocar, substitua este arquivo
       por outra imagem com o mesmo nome (ou ajuste o import em EtapaTipo.jsx). -->
